# Shared proxy settings for CrystalNexus locations.
# Installed by deploy/scripts/install.sh to /etc/nginx/snippets/crystalnexus-proxy.conf
# and included from every location in crystalnexus.conf (proxy_set_header directives are
# not inherited once a location sets its own, so they live here to avoid duplication).
proxy_pass http://127.0.0.1:8090;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Harmless; lets WebSocket upgrades work if the app ever adds them
# (CrystalNexus currently uses plain HTTP and SSE only).
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;
proxy_buffering off;   # needed for SSE progress streaming
