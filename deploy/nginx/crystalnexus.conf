# CrystalNexus - Nginx reverse proxy (HTTPS + HTTP Basic auth)
# Installed by deploy/scripts/install.sh to /etc/nginx/sites-available/crystalnexus.conf
# (rendered with the analytics token, so the installed copy is a secret: mode 640 root:www-data)

# Only send "Connection: upgrade" when the client asks for an upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Redirect plain HTTP to HTTPS (port 80 is closed by ufw; this is a harmless fallback).
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/crystalnexus.crt;
    ssl_certificate_key /etc/nginx/ssl/crystalnexus.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HTTP Basic authentication (the app itself has no login).
    # Create/modify users with: sudo htpasswd /etc/nginx/.htpasswd-crystalnexus <user>
    auth_basic           "CrystalNexus";
    auth_basic_user_file /etc/nginx/.htpasswd-crystalnexus;

    # The app accepts CIF uploads up to MAX_FILE_SIZE (default 50 MB); leave headroom
    # for multipart overhead. Raise this together with MAX_FILE_SIZE if you change it.
    client_max_body_size 55m;

    # Relaxations can run up to RELAX_TIMEOUT_SECONDS (default 600 s) and the
    # progress endpoint (/api/relax-progress/...) streams Server-Sent Events,
    # so allow long reads and disable buffering.
    proxy_connect_timeout 60s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;

    # Default: everything except analytics. Clear any client-supplied analytics
    # token so it cannot be injected from the browser.
    location / {
        proxy_set_header X-Analytics-Token "";
        include /etc/nginx/snippets/crystalnexus-proxy.conf;
    }

    # Analytics dashboard and API: reachable by anyone who passes Basic auth
    # (auth_basic above applies here too). Nginx supplies the app's analytics token
    # itself, so users do not need to know it. The placeholder is replaced by
    # install.sh at install time; never commit the real token.
    location /analytics {
        proxy_set_header X-Analytics-Token "__ANALYTICS_TOKEN__";
        include /etc/nginx/snippets/crystalnexus-proxy.conf;
    }

    location /api/analytics/ {
        proxy_set_header X-Analytics-Token "__ANALYTICS_TOKEN__";
        include /etc/nginx/snippets/crystalnexus-proxy.conf;
    }
}
